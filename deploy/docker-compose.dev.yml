# Local development database: docker compose -f deploy/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xpanel
      POSTGRES_PASSWORD: xpanel
      POSTGRES_DB: xpanel
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - xpanel-pg:/var/lib/postgresql/data

volumes:
  xpanel-pg:
