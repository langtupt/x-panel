# Managed by X-Panel: requests for a host name no website uses.
# Without this, port 80 shows the distribution's nginx page and port 443
# falls through to the first customer vhost (its certificate and its site).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
