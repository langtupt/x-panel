# X-Panel UI/API on https://<server>:8888 -> xpanel-api on unix:/run/xpanel-api/api.sock
# Installed to /etc/nginx/conf.d/ (included inside the http{} block on
# Debian and Ubuntu).

# Customer vhosts generated by xpanel-agent (one directory per Linux user).
include /etc/nginx/conf.d/xpanel/*/*.conf;

map $http_upgrade $xpanel_conn_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8888 ssl;
    listen [::]:8888 ssl;
    server_name _;

    ssl_certificate     /etc/xpanel/ssl/panel.crt;
    ssl_certificate_key /etc/xpanel/ssl/panel.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:xpanel:10m;

    client_max_body_size 1024m;

    # Panel add-ons (phpMyAdmin) written by xpanel-agent.
    include /etc/xpanel/nginx/panel.d/*.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://unix:/run/xpanel-api/api.sock:;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $xpanel_conn_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;  # stream uploads to the file manager
    }
}
